# Site Crown sur Render : site statique, sans étape de construction.
# Site officiel de Crown, servi sur crown.ooo.
services:
  - type: web
    name: crown
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /a-propos
        destination: /a-propos.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /espace-client
        destination: /espace-client.html
      - type: rewrite
        source: /mentions-legales
        destination: /mentions-legales.html
      - type: rewrite
        source: /confidentialite
        destination: /confidentialite.html
      - type: rewrite
        source: /activites/:nom
        destination: /activites/:nom.html
